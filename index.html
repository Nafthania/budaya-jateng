<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Jateng Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="pb-24">

    <header class="p-5 sticky top-0 bg-white/80 backdrop-blur-md z-50 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="text-xl font-bold text-amber-900">PESONA JATENG</h1>
            <span id="userStatus" class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full">Online</span>
        </div>
        <div class="flex gap-4">
            <button onclick="playMusic()" class="text-amber-800"><i class="fas fa-music"></i></button>
            <button class="text-amber-800"><i class="fas fa-bell"></i></button>
        </div>
    </header>

    <main id="app-content" class="p-4">
        </main>

    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-3 shadow-lg">
        <button onclick="renderHome()" class="flex flex-col items-center text-amber-900"><i class="fas fa-home"></i><span class="text-[10px]">Home</span></button>
        <button onclick="renderExplore()" class="flex flex-col items-center text-gray-400"><i class="fas fa-map"></i><span class="text-[10px]">Explore</span></button>
        <button onclick="renderQuiz()" class="flex flex-col items-center text-gray-400"><i class="fas fa-graduation-cap"></i><span class="text-[10px]">Kuis</span></button>
        <button onclick="renderProfile()" class="flex flex-col items-center text-gray-400"><i class="fas fa-user"></i><span class="text-[10px]">Profil</span></button>
    </nav>

    <script src="data.js"></script>
    <script>
        const content = document.getElementById('app-content');

        // Fitur: Render Home
        function renderHome() {
            content.innerHTML = `
                <div class="mb-6 rounded-2xl overflow-hidden shadow-lg bg-amber-900 h-40 relative">
                    <img src="https://images.unsplash.com/photo-1590059391152-3df649f87f97" class="w-full h-full object-cover opacity-50">
                    <div class="absolute bottom-4 left-4 text-white">
                        <h2 class="text-lg font-bold">Sugeng Rawuh!</h2>
                        <p class="text-xs">Temukan keajaiban budaya di sini.</p>
                    </div>
                </div>
                <h3 class="font-bold mb-3">Rekomendasi Hari Ini</h3>
                <div class="grid grid-cols-2 gap-3" id="home-list"></div>
            `;
            const list = document.getElementById('home-list');
            DATA_BUDAYA.slice(0, 2).forEach(item => {
                list.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm p-2">
                        <img src="${item.gambar}" class="w-full h-24 object-cover rounded-lg mb-2">
                        <h4 class="font-bold text-xs">${item.nama}</h4>
                    </div>
                `;
            });
        }

        // Fitur: Render Explore (Full Ensiklopedia)
        function renderExplore() {
            content.innerHTML = `<h2 class="font-bold text-lg mb-4">Ensiklopedia Budaya</h2>`;
            DATA_BUDAYA.forEach(item => {
                content.innerHTML += `
                    <div class="card-budaya bg-white p-4 rounded-xl mb-4 shadow-sm flex gap-4">
                        <img src="${item.gambar}" class="w-20 h-20 rounded-lg object-cover">
                        <div>
                            <span class="text-[9px] uppercase font-bold text-amber-600">${item.kategori}</span>
                            <h3 class="font-bold text-amber-900">${item.nama}</h3>
                            <p class="text-[11px] text-gray-600">${item.deskripsi.substring(0, 60)}...</p>
                        </div>
                    </div>
                `;
            });
        }

        // Fitur: Render Kuis dengan LocalStorage (Skor Tersimpan)
        function renderQuiz() {
            let skor = localStorage.getItem('skor_budaya') || 0;
            content.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-md border-t-4 border-amber-700">
                    <h2 class="font-bold text-center">Uji Wawasan</h2>
                    <p class="text-center text-xs mb-4">Skor Tertinggi Anda: ${skor}</p>
                    <hr class="mb-4">
                    <div id="quiz-area">
                        <p class="font-semibold text-sm mb-4">${DATA_KUIS[0].pertanyaan}</p>
                        ${DATA_KUIS[0].pilihan.map((p, i) => `
                            <button onclick="checkJawaban(${i})" class="w-full p-3 mb-2 bg-amber-50 rounded-lg text-sm text-left hover:bg-amber-100">${p}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkJawaban(idx) {
            if(idx === DATA_KUIS[0].jawaban) {
                alert("Leres! (Benar)");
                localStorage.setItem('skor_budaya', 100);
                renderQuiz();
            } else {
                alert("Salah, coba lagi!");
            }
        }

        // Jalankan Home saat pertama buka
        renderHome();
    </script>
</body>
</html>
