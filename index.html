<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesona Jateng Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-20">

    <header class="bg-white p-5 shadow-sm sticky top-0 z-50 flex items-center gap-3">
        <div class="w-10 h-10 bg-amber-800 rounded-full flex items-center justify-center text-white font-bold">PJ</div>
        <h1 class="text-xl font-bold text-amber-900 tracking-tight">PESONA JATENG</h1>
    </header>

    <main id="app-content" class="p-4 max-w-md mx-auto">
        <div class="animate-pulse flex flex-col gap-4">
            <div class="h-48 bg-gray-200 rounded-xl"></div>
            <div class="h-10 bg-gray-200 rounded-md w-3/4"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-3 shadow-2xl max-w-md left-1/2 -translate-x-1/2">
        <button onclick="showHome()" class="flex flex-col items-center text-amber-900">
            <span class="text-xs font-bold">Beranda</span>
        </button>
        <button onclick="showKuis()" class="flex flex-col items-center text-gray-400">
            <span class="text-xs font-bold">Kuis</span>
        </button>
    </nav>

    <script src="data.js"></script>
    <script>
        const content = document.getElementById('app-content');

        // Fungsi menampilkan daftar budaya
        function showHome() {
            let html = '<h2 class="text-lg font-bold mb-4">Jelajahi Budaya</h2>';
            DATA_BUDAYA.forEach(item => {
                html += `
                    <div class="card-item">
                        <img src="${item.gambar}" 
                             alt="${item.nama}" 
                             class="w-full h-48 object-cover"
                             onerror="this.src='https://via.placeholder.com/400x200?text=Gambar+Rusak'">
                        <div class="p-4">
                            <span class="badge">${item.kategori}</span>
                            <h3 class="text-lg font-bold mt-2 text-amber-950">${item.nama}</h3>
                            <p class="text-sm text-gray-600 mt-1">${item.deskripsi}</p>
                        </div>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        function showKuis() {
            content.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-md text-center">
                    <h2 class="font-bold text-amber-900">Uji Wawasan</h2>
                    <p class="text-sm text-gray-500 mt-2">Fitur kuis sedang disiapkan untuk Anda.</p>
                </div>
            `;
        }

        // Jalankan otomatis saat halaman selesai dimuat
        window.onload = () => {
            if (typeof DATA_BUDAYA !== 'undefined') {
                showHome();
            } else {
                content.innerHTML = "<div class='p-10 text-center text-red-500'>Gagal Memuat File data.js. Pastikan file ada di GitHub!</div>";
            }
        };
    </script>
</body>
</html>
